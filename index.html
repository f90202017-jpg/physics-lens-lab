<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر الفيزياء التفاعلي – محاكاة العدسات</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f1f5f9;color:#24364e;font-family:Arial,Tahoma,sans-serif;text-align:center}h1{font-size:clamp(21px,5vw,32px);margin:12px 0 5px}p{color:#5b6b7b;line-height:1.7}.panel{background:#fff;border-radius:20px;padding:18px;margin:16px auto;max-width:850px;box-shadow:0 3px 14px #23354a0b}.switch{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}.switch button{font:inherit;font-weight:bold;border:2px solid #b6cbe5;background:white;color:#3479ca;padding:12px 18px;border-radius:12px;cursor:pointer}.switch button.active{background:#315f99;color:white}.control{margin:18px auto;max-width:660px;text-align:right}.control label{display:block;font-size:18px;font-weight:bold;margin-bottom:8px}.control output{color:#3167a4}input[type=range]{width:100%;accent-color:#3269ae;direction:ltr}.diagram{width:100%;height:auto;background:#f8fafc;border:1px solid #dbe6f2;border-radius:15px;touch-action:pan-y}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:14px 0;font-size:14px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px}.results{background:#f2f7fc;border-radius:12px;padding:15px;line-height:2;font-size:17px;text-align:right}.note{font-size:13px;color:#657588}button:focus-visible,input:focus-visible{outline:3px solid #f2a83b} 
</style></head><body><h1>مختبر الفيزياء التفاعلي 🔬</h1><p>الفيزياء 3 | استكشاف تكوُّن الصور في العدسات الرقيقة</p><section class="panel"><div class="switch"><button id="convex" class="active" type="button">العدسة المحدبة (المجمِّعة)</button><button id="concave" type="button">العدسة المقعرة (المفرِّقة)</button></div><div class="control"><label for="distance">بُعد الجسم عن العدسة: <output id="dOut">120</output></label><input id="distance" type="range" min="30" max="250" value="120" step="1"></div><div class="control"><label for="focal">مقدار البعد البؤري: <output id="fOut">60</output></label><input id="focal" type="range" min="40" max="100" value="60" step="1"></div></section><section class="panel"><svg id="diagram" class="diagram" viewBox="0 0 800 450" role="img" aria-label="رسم الأشعة في العدسة" xmlns="http://www.w3.org/2000/svg"></svg><div class="legend"><span><i class="dot" style="background:#e38b26"></i>موازٍ للمحور ثم يمر بالبؤرة</span><span><i class="dot" style="background:#269c6b"></i>يمر بالمركز البصري</span><span><i class="dot" style="background:#8a58d3"></i>يمر بالبؤرة ثم يوازي المحور</span></div><p class="note">الخط المتصل شعاع ضوئي، والخط المتقطع امتداد هندسي وهمي. الرسم يتكيف تلقائيًا مع القيم.</p></section><section class="panel"><h2>نتائج التجربة</h2><div id="results" class="results" aria-live="polite"></div></section><script>
const svg=document.getElementById('diagram'),dist=document.getElementById('distance'),focal=document.getElementById('focal');let type='convex';const cx=400,cy=225,H=85,S=1.42,W=800,Y=450;
function line(x1,y1,x2,y2,color,dash=false,width=3){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?'stroke-dasharray="7 6"':''} stroke-linecap="round"/>`}
function text(x,y,s,color='#46576b',size=15){return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-family="Arial,Tahoma" text-anchor="middle">${s}</text>`}
function rayFromLens(x0,y0,slope,color,dashed=false,back=false){const tx=back?0:W,ty=y0+slope*(tx-x0);return line(x0,y0,tx,ty,color,dashed)}
function draw(){const d=+dist.value,f=+focal.value,ff=type==='convex'?f:-f,ox=cx-d*S,oy=cy-H,eps=1e-9;document.getElementById('dOut').textContent=d;document.getElementById('fOut').textContent=f;document.getElementById('convex').classList.toggle('active',type==='convex');document.getElementById('concave').classList.toggle('active',type==='concave');let out=line(0,cy,W,cy,'#9aaaba',false,1.7);for(let side of [-1,1])for(let n of [1,2]){const x=cx+side*n*f*S;if(x>12&&x<W-12){out+=`<circle cx="${x}" cy="${cy}" r="4" fill="#d95c58"/>`+text(x,cy+23,n===1?'F':'2F','#b34b48',13)}}
// Convex: wider in the centre; concave: thinner in the centre.
let lensPath=type==='convex'?`M 394 105 Q 367 225 394 345 Q 400 351 406 345 Q 433 225 406 105 Q 400 99 394 105 Z`:`M 380 105 Q 401 225 380 345 Q 400 351 420 345 Q 399 225 420 105 Q 400 99 380 105 Z`;
out+=`<path d="${lensPath}" fill="#a9dcf8" fill-opacity=".45" stroke="#3489c8" stroke-width="2.5"/>`+line(cx,100,cx,350,'#3374ad',false,1.3)+text(cx+17,95,'O','#3374ad');
// object arrow
out+=line(ox,cy,ox,oy,'#263c5b',false,5)+`<path d="M ${ox-8} ${oy+13} L ${ox} ${oy} L ${ox+8} ${oy+13}" fill="none" stroke="#263c5b" stroke-width="4"/>`+text(ox,cy+38,'الجسم');
const isInf=type==='convex'&&d===f,di=isInf?Infinity:(ff*d)/(d-ff),m=isInf?Infinity:-di/d,ix=cx+di*S,iy=cy-m*H;
// ray 1: parallel to axis then through right focus (or diverges as if from left focus)
out+=line(ox,oy,cx,oy,'#e38b26');out+=rayFromLens(cx,oy,H/(ff*S),'#e38b26');if(type==='concave')out+=rayFromLens(cx,oy,H/(ff*S),'#e38b26',true,true);
// ray 2: central, straight
out+=line(ox,oy,cx,cy,'#269c6b');out+=rayFromLens(cx,cy,H/(d*S),'#269c6b');if(type==='concave')out+=line(cx,cy,ix,iy,'#269c6b',true,2);
// ray 3: from object towards front focus, then parallel to axis; for concave aimed towards far focus
const slope3=type==='convex'?H/((d-f)*S):H/((d+f)*S);if(!isInf){const lensY=oy+slope3*(cx-ox);out+=line(ox,oy,cx,lensY,'#8a58d3');out+=rayFromLens(cx,lensY,0,'#8a58d3');if(di<0)out+=line(cx,lensY,ix,iy,'#8a58d3',true,2)}
if(!isInf&&Number.isFinite(ix)){if(ix>=0&&ix<=W){const virtual=di<0;out+=line(ix,cy,ix,iy,'#d94f60',virtual,5);const a=m>=0?-1:1;out+=`<path d="M ${ix-8} ${iy-a*13} L ${ix} ${iy} L ${ix+8} ${iy-a*13}" fill="none" stroke="#d94f60" stroke-width="4" ${virtual?'stroke-dasharray="5 4"':''}/>`+text(ix,iy+(m>=0?-14:23),'الصورة','#c34b59')}else out+=text(680,420,'الصورة خارج مجال الرسم','#b54c5a',16)}
svg.innerHTML=out;let description;if(isInf){description='الجسم عند البؤرة؛ الأشعة الخارجة متوازية، والصورة عند اللانهاية.'}else{const kind=di>0?'حقيقية':'وهمية (تقديرية)',orient=m<0?'مقلوبة':'معتدلة',size=Math.abs(m)>1+eps?'مكبّرة':Math.abs(m)<1-eps?'مصغّرة':'مساوية لحجم الجسم';description=`الصورة ${kind}، ${orient}، ${size}.`}
document.getElementById('results').innerHTML=`<strong>${description}</strong><div>بُعد الصورة (dᵢ): ${isInf?'∞':di.toFixed(1)} وحدة</div><div>التكبير (m): ${isInf?'غير محدود':m.toFixed(2)}</div><div class="note">الإشارة السالبة لبُعد الصورة تعني أنها تقع في جهة الجسم. القيم بوحدات افتراضية متسقة.</div>`}
dist.addEventListener('input',draw);focal.addEventListener('input',draw);document.getElementById('convex').onclick=()=>{type='convex';draw()};document.getElementById('concave').onclick=()=>{type='concave';draw()};draw();
</script></body></html>
